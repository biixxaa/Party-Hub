# Netlify configuration for Party Hub Frontend

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://party-hub-gipg.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback: Route all frontend paths to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

